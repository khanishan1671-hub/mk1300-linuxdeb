name: Build Linux Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

    - name: Build Tauri App
      run: |
        # 1. Install the Tauri CLI tool (This was missing!)
        cargo install tauri-cli --version "^2.0.0" --locked
        
        # 2. Install the project generator
        cargo install create-tauri-app --locked
        
        # 3. Generate the Tauri project
        cargo create-tauri-app ishan-app --template vanilla --manager cargo --yes
        cd ishan-app
        
        # 4. Verify the HTML file exists before copying
        echo "Current directory contents:"
        ls -la ../
        
        # 5. Copy your HTML file (make sure the filename matches exactly!)
        cp "../Final Software.html" src/index.html
        
        # 6. Build the .deb package
        cargo tauri build

    - name: Upload Deb Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-deb
        path: ishan-app/target/release/bundle/deb/*.deb
