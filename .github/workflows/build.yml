name: Build Linux Deb

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Fixes the Node.js deprecation warning

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

    - name: Build Tauri App
      run: |
        # 1. Install the Tauri CLI tool
        cargo install tauri-cli --version "^2.0.0" --locked
        
        # 2. Generate the Tauri project
        cargo create-tauri-app ishan-app --template vanilla --manager cargo --yes
        cd ishan-app
        
        # 3. Copy your HTML file
        cp "../Final Software.html" index.html
        cp "../Final Software.html" src/index.html
        
        # 4. Build the .deb package directly with cargo
        cargo tauri build

    - name: Upload Deb Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-deb
        path: ishan-app/target/release/bundle/deb/*.deb
